<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1f2c">
<title>Agente oficial BPLAY</title>
<meta name="description" content="Creá tu cuenta en BPLAY con la ayuda de un agente oficial y activá tu bono de bienvenida.">
<link rel="icon" href="/icon.svg">
<link rel="manifest" href="/manifest.json">
<style>
  :root{--ink:#0f1d26;--ink-2:#46596a;--muted:#7a8b98;--bg:#f3f6f8;--dark:#0b1f2c;--dark-2:#12324a;--accent:#1fa463;--accent-2:#16884f;--line:#e2e8ec;--gold:#f5c542}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .top{background:var(--dark);color:#fff;position:relative;overflow:hidden}
  .top:before{content:"";position:absolute;inset:-40% -20% auto auto;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(31,164,99,.35),transparent 65%);pointer-events:none}
  .bar{display:flex;align-items:center;gap:10px;padding:14px 16px;max-width:1160px;margin:0 auto;position:relative}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.01em}
  .brand img{height:28px}
  .seal{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
  .bar .pill{margin-left:auto;font-size:12px;border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:5px 10px;white-space:nowrap}
  .wrap{max-width:1160px;margin:0 auto;padding:0 16px}
  .hero{display:grid;grid-template-columns:1fr 420px;gap:40px;align-items:start;padding:28px 16px 56px;position:relative}
  h1{font-size:clamp(28px,4.4vw,48px);line-height:1.06;margin:6px 0 14px;letter-spacing:-.02em}
  h1 em{font-style:normal;color:var(--gold)}
  .sub{font-size:17px;line-height:1.5;color:#c8d6df;margin:0 0 22px;max-width:560px}
  .trust{list-style:none;padding:0;margin:0 0 26px;display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;max-width:600px}
  .trust li{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;line-height:1.35;color:#e8f0f4}
  .trust svg{flex-shrink:0;margin-top:1px}
  .bonos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .bono{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px 12px;min-width:150px;flex:1;max-width:260px}
  .bono b{display:block;font-size:13px;color:#9fb6c4;font-weight:600;margin-bottom:3px}
  .bono span{font-size:14px;line-height:1.3}
  .cta{display:none}
  .chatbox{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.35);height:640px;position:sticky;top:16px}
  .chatbox iframe{width:100%;height:100%;border:0;display:block}
  section{padding:48px 0}
  h2{font-size:26px;margin:0 0 20px;letter-spacing:-.01em}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:s}
  .step{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
  .step:before{counter-increment:s;content:counter(s);width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:grid;place-items:center;margin-bottom:12px}
  .step p{margin:0;line-height:1.45;color:var(--ink-2)}
  .faq details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:10px}
  .faq summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
  .faq summary::-webkit-details-marker{display:none}
  .faq summary:after{content:"+";color:var(--muted);font-weight:400;font-size:20px;line-height:1}
  .faq details[open] summary:after{content:"–"}
  .faq p{margin:10px 0 0;color:var(--ink-2);line-height:1.5}
  footer{background:var(--dark);color:#9fb6c4;font-size:13px;line-height:1.5;padding:28px 0 90px}
  footer .r18{display:inline-grid;place-items:center;width:34px;height:34px;border:2px solid #9fb6c4;border-radius:50%;font-weight:800;color:#fff;margin-right:10px;vertical-align:middle;font-size:12px}
  .sticky{display:none}
  @media (max-width:900px){
    .hero{grid-template-columns:1fr;gap:18px;padding:12px 16px 24px}
    .sub{font-size:15.5px;margin-bottom:16px}
    .trust{grid-template-columns:1fr;gap:8px;margin-bottom:16px}
    .chatbox{position:relative;top:0;height:78vh;min-height:520px;border-radius:14px}
    .steps{grid-template-columns:1fr}
    .bono{min-width:0;flex:1 1 140px}
    .sticky{display:flex;position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:20}
    .sticky a{flex:1;text-align:center;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:15px;border-radius:30px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
    .sticky.hide{display:none}
  }
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <div class="brand" id="brand"><span class="seal"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="#fff" d="M12 1l2.6 2.1 3.3-.3 1 3.2 2.9 1.6-.9 3.2 1.4 3-2.7 1.9-.4 3.3-3.3.5L12 23l-2.6-2.1-3.3.3-1-3.2L2.2 16.4l.9-3.2-1.4-3 2.7-1.9.4-3.3 3.3-.5z" opacity=".35"/><path fill="#fff" d="M10.6 15.6l-3.2-3.2 1.4-1.4 1.8 1.8 4.6-4.6 1.4 1.4z"/></svg></span><span id="brandName">Agente oficial BPLAY</span></div>
    <span class="pill">+18 · Juego responsable</span>
  </div>
  <div class="wrap hero">
    <div>
      <h1 id="headline">Creá tu cuenta en BPLAY y activá tu bono de bienvenida</h1>
      <p class="sub" id="sub"></p>
      <ul class="trust" id="trust"></ul>
      <div class="bonos" id="bonos"></div>
    </div>
    <div class="chatbox" id="chat"><iframe id="chatFrame" title="Chat con un agente" allow="notifications"></iframe></div>
  </div>
</div>

<main class="wrap">
  <section><h2>Cómo funciona</h2><div class="steps" id="steps"></div></section>
  <section class="faq"><h2>Preguntas frecuentes</h2><div id="faq"></div></section>
</main>
<footer><div class="wrap"><span class="r18">+18</span><span id="footer"></span></div></footer>
<div class="sticky" id="sticky"><a href="#chat" id="ctaBtn">Hablar con un agente</a></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const qs = new URLSearchParams(location.search);
  const p = new URLSearchParams({ embed: 'inline' });
  ['utm_source','utm_campaign','utm_content','src','prov'].forEach(k => qs.get(k) && p.set(k, qs.get(k)));
  if (qs.get('fbclid') && !qs.get('src') && !qs.get('utm_source')) p.set('src', 'meta');
  $('chatFrame').src = '/chat?' + p.toString();
  const check = '<svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#1fa463"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>';

  fetch('/api/chat/config').then(r => r.json()).then(cfg => {
    const L = cfg.landing || {};
    document.title = cfg.brand_name || document.title;
    $('brandName').textContent = cfg.brand_name;
    if (L.logo_url) $('brand').innerHTML = `<img src="${esc(L.logo_url)}" alt="${esc(cfg.brand_name)}"><span>${esc(cfg.brand_name)}</span>`;
    $('headline').textContent = L.headline || '';
    $('sub').textContent = L.subheadline || '';
    $('ctaBtn').textContent = L.cta || 'Hablar con un agente';
    $('trust').innerHTML = (L.trust_points || []).map(t => `<li>${check}<span>${esc(t)}</span></li>`).join('');
    const bonos = Object.values(cfg.provinces).filter(x => x.bonus);
    $('bonos').innerHTML = bonos.map(b => `<div class="bono"><b>${esc(b.label)}</b><span>${esc(b.bonus)}</span></div>`).join('');
    $('steps').innerHTML = (L.steps || []).map(s => `<div class="step"><p>${esc(s)}</p></div>`).join('');
    $('faq').innerHTML = (L.faq || []).map(f => `<details><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join('');
    $('footer').textContent = L.footer || '';
    if (L.pixel_id) loadPixel(L.pixel_id);
  });

  // Meta Pixel: PageView acá; Lead y LinkRegistro los avisa el chat
  function loadPixel(id) {
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', id); fbq('track', 'PageView');
  }
  window.addEventListener('message', e => {
    if (e.origin !== location.origin || !window.fbq) return;
    if (e.data === 'bpc:lead') fbq('track', 'Lead');
    if (e.data === 'bpc:link') fbq('trackCustom', 'LinkRegistro');
    if (e.data === 'bpc:carga') { fbq('track', 'AddPaymentInfo'); fbq('trackCustom', 'CargaReportada'); }
  });

  // botón flotante en celu: se oculta cuando el chat está a la vista
  const io = new IntersectionObserver(([en]) => $('sticky').classList.toggle('hide', en.isIntersecting), { threshold: .35 });
  io.observe($('chat'));
})();
</script>
</body>
</html>
